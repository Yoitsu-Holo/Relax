# 生产环境配置示例
nodes:
  - id: node-1
    address: cache-node-1.example.com:50051
  - id: node-2
    address: cache-node-2.example.com:50051
  - id: node-3
    address: cache-node-3.example.com:50051
  - id: node-4
    address: cache-node-4.example.com:50051
  - id: node-5
    address: cache-node-5.example.com:50051

# 健康检查间隔
health_check_interval: 30s

# 集群节点的 gRPC 服务端口
grpc_port: ":50052"

# 集群节点的 HTTP 网关端口
http_port: ":8081"
